  version: '3'
  services:
    postgres:
      image: postgres:17-alpine
      container_name: postgres
      restart: unless-stopped
      environment:
        POSTGRES_USER: ${POSTGRES_ADMIN_USER}
        POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
        POSTGRES_DB: n8n-db
      volumes:
        - postgres-data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
        interval: 10s
        timeout: 5s
        retries: 5

  # Next.js dashboard service for the application this can 
  # later be replaced with any other service that you want to run in the application server
    dashboard:
      build:
        context: ./dashboard
        dockerfile: Dockerfile
      container_name: dashboard
      restart: unless-stopped
      environment:
        DATABASE_URL: postgresql://${DASHBOARD_DB_USER}:${DASHBOARD_DB_PASSWORD}@postgres:5432/dashboard-db
      ports:
        - "8080:3000"
      depends_on:
        postgres: 
          condition: service_healthy

# n8n service for workflow automation on the server, this can be used to automate tasks and workflows for the application
    n8n:      
      image: n8nio/n8n:latest
      restart: unless-stopped
      ports:
        - "5678:5678"
      environment:
        DB_TYPE: postgresdb
        DB_POSTGRESDB_HOST: postgres
        DB_POSTGRESDB_PORT: 5432
        DB_POSTGRESDB_DATABASE: n8n_db
        DB_POSTGRESDB_USER: ${N8N_DB_USER}
        DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
        DB_POSTGRESDB_SCHEMA: public
        N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      volumes:
        - n8n-data:/home/node/.n8n
      depends_on:
        postgres: 
          condition: service_healthy
  volumes:
    postgres-data:
    n8n-data: